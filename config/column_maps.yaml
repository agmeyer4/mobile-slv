# Column rename maps for Stage 02 standardization.
# Partial maps — only cross-instrument science columns are renamed.
# All other columns pass through with their original names.
# Eng maps inherit Raw via YAML merge (<<) and add wet-concentration variants.

LANL_aerisultra321:
  Raw: &u321_base
    "P (mbars)":  P_mbar
    "Tgas(degC)": Tgas_C
    "CH4 (ppm)":  CH4_ppm
    "H2O (ppm)":  H2O_ppm
    "C2H6 (ppm)": C2H6_ppm
    "C3H8 (ppm)": C3H8_ppm
  Eng:
    <<: *u321_base
    "CH4 (ppm)-Wet":  CH4_ppm_wet
    "C2H6 (ppm)-Wet": C2H6_ppm_wet
    "C3H8 (ppm)-Wet": C3H8_ppm_wet

LANL_aerispico017:
  Raw: &p017_base
    "P (mbars)":  P_mbar
    "Tgas(degC)": Tgas_C
    "CH4 (ppm)":  CH4_ppm
    "H2O (ppm)":  H2O_ppm
    "C2H6 (ppb)": C2H6_ppb
    "R":          R
    "C2/C1":      C2C1
  Eng:
    <<: *p017_base
    "CH4 (ppm)-Wet":  CH4_ppm_wet
    "C2H6 (ppb)-Wet": C2H6_ppb_wet

WYO_aerisultra460:
  Raw: &u460_base
    "P (mbars)":  P_mbar
    "Tgas(degC)": Tgas_C
    "CH4 (ppm)":  CH4_ppm
    "H2O (ppm)":  H2O_ppm
    "C2H6 (ppb)": C2H6_ppb
    "R":          R
    "C2/C1":      C2C1
  Eng:
    <<: *u460_base

WYO_picarro:
  Raw:
    CO_sync:      CO_ppm
    CO2_dry_sync: CO2_ppm
    CH4_dry_sync: CH4_ppm
    H2O_sync:     H2O_ppm

UOU_LGR:
  Raw:
    CH4d_ppm_raw: CH4_ppm
    H2O_ppm:      H2O_ppm
    CO2d_ppm_raw: CO2_ppm

WYO_sprinter:
  Raw:
    "Latitude (DD.ddd +N)":      lat_deg
    "Longitude (DDD.ddd -W)":    lon_deg
    "Altitude (m)":              altitude_m
    "Air Temperature (C)":       temp_C
    "RH(%)":                     RH_pct
    "Dew Point (C)":             dew_pt_C
    "Wind Direction (Deg True)": wind_dir_true
    "Wind Speed (m/s)":          wind_spd_ms
    "Pressure (bar)":            pressure_bar
    "Heading(deg)":              heading_deg
    "GPSCorWindDirTrue (deg)":   gps_wind_dir_true
    "GPSCorWindSpeed (m/s)":     gps_wind_spd_ms
