    platform: MML
    instruments: [LANL_aerisultra321, LANL_aerispico017, LANL_GPS, LANL_Anem]

  - date: 2026-01-20
    platform: MML
    instruments: [LANL_aerisultra321, LANL_aerispico017, LANL_GPS, LANL_Anem]

  - date: 2026-01-21
    platform: MML
    instruments: [LANL_aerisultra321, LANL_aerispico017, LANL_GPS, LANL_Anem]

